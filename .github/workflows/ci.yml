name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
      - run: npm ci
      - run: npm install -g @openai/codex@0.146.0
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run bindings:check
  package:
    # Builds the unsigned disk image when a version tag is pushed. It publishes nothing and does not notarize.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dmg --arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: margin-dmg
          path: dist/Margin-*-arm64.dmg
          if-no-files-found: error
