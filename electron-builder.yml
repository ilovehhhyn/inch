# Packages Margin as an unsigned macOS app for Apple silicon. Signing and notarization are not configured on purpose.
appId: io.github.ilovehhhyn.margin
productName: Margin
directories:
  output: dist
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
  # `null` skips code signing; without it electron-builder would search the keychain for an identity and sign with the first one it finds.
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Margin records your voice only while you hold the right Option key, and transcribes it on this Mac.
artifactName: ${productName}-${version}-${arch}.${ext}
